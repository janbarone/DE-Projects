# Alembic configuration for the bronze schema migrations.
# Run from the repo root:
#   alembic -c db/alembic.ini upgrade head
#   alembic -c db/alembic.ini downgrade -1
# The connection URL defaults below; DATABASE_URL in the environment (or .env)
# overrides it at runtime (see db/migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/dota

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
