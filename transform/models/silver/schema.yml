version: 2

models:
  - name: stg_leagues
    description: One row per league.
    columns:
      - name: leagueid
        tests: [not_null, unique]

  - name: stg_teams
    description: One row per team.
    columns:
      - name: team_id
        tests: [not_null, unique]

  - name: stg_players
    description: One row per pro player.
    columns:
      - name: account_id
        tests: [not_null, unique]

  - name: stg_heroes
    description: One row per hero, from constants heroes resource.
    columns:
      - name: hero_id
        tests: [not_null, unique]
      - name: primary_attr
        tests:
          - accepted_values:
              values: ['str', 'agi', 'int', 'all']

  - name: stg_constants
    description: One row per constants resource, full payload preserved as jsonb.
    columns:
      - name: resource
        tests: [not_null, unique]

  - name: stg_hero_stats
    description: One row per hero aggregate from /heroStats.
    columns:
      - name: hero_id
        tests: [not_null, unique]

  - name: stg_matches
    description: One row per match.
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: winner
        tests:
          - accepted_values:
              values: ['radiant', 'dire', 'draw']

  - name: stg_match_players
    description: One row per (match, player).
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: team_number
        tests:
          - accepted_values:
              values: ['0', '1']

  - name: stg_picks_bans
    description: One row per (match, draft order).
    columns:
      - name: match_id
        tests: [not_null]
      - name: order_no
        tests: [not_null]

  - name: stg_teamfights
    description: One row per (match, teamfight).
    columns:
      - name: match_id
        tests: [not_null]
      - name: teamfight_id
        tests: [not_null]

  - name: stg_match_player_minute
    description: One row per (match, player, minute) - per-minute gold/xp/last_hits/denies flattened from the raw payload arrays. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: minute
        tests: [not_null]
      - name: gold
        tests: [not_null]
      - name: xp
        tests: [not_null]
      - name: last_hits
        tests: [not_null]
      - name: denies
        tests: [not_null]

  - name: stg_match_player_skills
    description: One row per (match, player, ability upgrade) - ability ids in learning order flattened from the raw ability_upgrades_arr. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: upgrade_index
        tests: [not_null]
      - name: ability_id
        tests: [not_null]

  - name: stg_match_player_item_purchases
    description: One row per (match, player, item purchase) - item purchases (key = item_internal_name, time = seconds, negative = pre-game) flattened from the raw per-player purchase_log array, minute clamped to 0. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: purchase_index
        tests: [not_null]
      - name: item_internal_name
        tests: [not_null]
      - name: time_sec
        tests: [not_null]
      - name: minute
        tests: [not_null]

  - name: stg_match_player_kills
    description: One row per (match, player, kill) - the kill timeline (victim npc hero name, time in seconds) flattened from the raw per-player kills_log array. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: kill_index
        tests: [not_null]
      - name: victim_hero_name
        tests: [not_null]
      - name: time_sec
        tests: [not_null]

  - name: stg_match_player_runes
    description: One row per (match, player, rune type) - total runes picked up, flattened from the raw per-player runes object (key = rune type id, value = count). Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: rune_key
        tests: [not_null]
      - name: rune_count
        tests: [not_null]

  - name: stg_match_player_damage
    description: One row per (match, player, target) - total damage dealt to each target unit, flattened from the raw per-player damage object. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: target_key
        tests: [not_null]
      - name: damage_amount
        tests: [not_null]

  - name: stg_match_player_damage_taken
    description: One row per (match, player, source) - raw damage received from each source unit, flattened from the raw per-player damage_taken object. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: source_key
        tests: [not_null]
      - name: damage_amount
        tests: [not_null]

  - name: stg_match_player_damage_taken_type
    description: One row per (match, player, inflictor) - raw damage received by ability/item/auto-attack with a classified damage type (Physical/Magical/Pure/Other), flattened from the raw per-player damage_inflictor_received object. Incremental on match_id.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: inflictor_key
        tests: [not_null]
      - name: damage_type
        tests: [not_null]
      - name: damage_amount
        tests: [not_null]
