version: 2

models:
  - name: dim_hero
    description: Conformed hero dimension (identity + hero_stats aggregates) plus an 'Unknown' hero (hero_id 0) so all fact hero_ids resolve.
    columns:
      - name: hero_id
        tests: [not_null, unique]

  - name: dim_player
    description: Conformed player dimension - pro players with metadata plus match-only participants so every account_id resolves.
    columns:
      - name: account_id
        tests: [not_null, unique]

  - name: dim_team
    description: Conformed team dimension - /teams plus 'Unknown' teams that appear only in matches.
    columns:
      - name: team_id
        tests: [not_null, unique]

  - name: dim_league
    description: League dimension.
    columns:
      - name: leagueid
        tests: [not_null, unique]

  - name: dim_game_mode
    description: Decode lookup for game_mode ids, flattened from stg_constants.
    columns:
      - name: game_mode_id
        tests: [not_null, unique]

  - name: dim_lobby_type
    description: Decode lookup for lobby_type ids, flattened from stg_constants.
    columns:
      - name: lobby_type_id
        tests: [not_null, unique]

  - name: dim_region
    description: Decode lookup for region ids, flattened from stg_constants.
    columns:
      - name: region_id
        tests: [not_null, unique]

  - name: dim_hero_role
    description: Bridge table, one row per (hero, role). dim_hero 1 -> many dim_hero_role for role filtering.
    columns:
      - name: hero_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: role
        tests:
          - not_null
          - accepted_values:
              values: ['Carry', 'Support', 'Nuker', 'Disabler', 'Durable', 'Escape', 'Initiator', 'Pusher']

  - name: dim_date
    description: Calendar dimension, one row per day from 2012-01-01 to 2027-12-31.
    columns:
      - name: date
        tests: [not_null, unique]
      - name: day_of_month
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: quarter
        tests: [not_null]

  - name: fact_matches
    description: One row per match (hub fact).
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: start_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: leagueid
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_league')
                field: leagueid
      - name: game_mode_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game_mode')
                field: game_mode_id
      - name: lobby_type_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lobby_type')
                field: lobby_type_id
      - name: region_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_id
      - name: score_bucket
        tests:
          - not_null
      - name: patch
        tests:
          - relationships:
              arguments:
                to: ref('dim_patch')
                field: patch_id
      - name: radiant_team_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: dire_team_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

  - name: fact_team_matches
    description: Bridge fact, one row per (match, side). Connects dim_team through a single path so radiant and dire teams are queryable together.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

  - name: fact_match_players
    description: One row per (match, player) performance fact.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: comp_sig
        tests: [not_null]
      - name: item_0
        tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_id

  - name: dim_patch
    description: Patch dimension decoding OpenDota's numeric patch ids to names/dates.
    columns:
      - name: patch_id
        tests: [not_null, unique]

  - name: dim_item
    description: Decode lookup for item ids (internal name + display name), flattened from item_ids joined to items.
    columns:
      - name: item_id
        tests: [not_null, unique]
      - name: item_name
        tests: [not_null]

  - name: fact_hero_matchups
    description: One row per (match, radiant hero, dire hero). Enables hero-vs-hero matchup analysis.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: radiant_hero_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: dire_hero_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: matchup_label
        tests: [not_null]
      - name: radiant_win
        tests: [not_null]

  - name: fact_team_h2h
    description: One row per match with both teams known, canonical team pair, team_a_win.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: team_a_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: team_b_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: team_a_name
        tests: [not_null]
      - name: team_b_name
        tests: [not_null]
      - name: team_a_win
        tests: [not_null]

  - name: fact_hero_matchups_hero
    description: Hero-centric matchup fact, one row per (match, hero, opponent). A single active dim_hero relationship filters a hero's games on both sides so a hero slicer shows the hero's true win rate vs every opponent.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: hero_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: opponent_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: hero_name
        tests: [not_null]
      - name: opponent_name
        tests: [not_null]
      - name: matchup_label
        tests: [not_null]
      - name: hero_win
        tests: [not_null]


  - name: fact_picks_bans
    description: One row per (match, draft order).
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: team_number
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1']

  - name: fact_draft_sequence
    description: One row per (match, draft slot); the slot count is derived
      dynamically (max picks/bans per team), denormalized to hero names + images
      for DirectQuery.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: slot
        tests:
          - not_null
      - name: dire_pick_seq
        tests:
          - seq_in_range
      - name: dire_ban_seq
        tests:
          - seq_in_range
      - name: radiant_pick_seq
        tests:
          - seq_in_range
      - name: radiant_ban_seq
        tests:
          - seq_in_range

  - name: fact_teamfights
    description: One row per (match, teamfight).
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: teamfight_id
        tests: [not_null]
      - name: fight_phase
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre-game', 'early (0-20m)', 'mid (20-40m)', 'late (40m+)']

  - name: fact_teamfight_players
    description: One row per (match, teamfight, player) at hero level, derived from the positional players array.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: teamfight_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
  - name: fact_teamfight_ability_uses
    description: One row per (match, teamfight, player, ability) usage. Flattens fact_teamfight_players.ability_uses.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: teamfight_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
      - name: ability_name
        tests: [not_null]
      - name: uses
        tests: [not_null]

  - name: fact_phase_momentum
    description: One row per (match, team, fight phase) with the team's gold/XP swing inside that phase's teamfights and the final team outcome. Excludes pre-game fights.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: team_number
        tests: [not_null]
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: fight_phase
        tests: [not_null]
      - name: phase_ord
        tests: [not_null]
      - name: gold_delta
        tests: [not_null]
      - name: fights
        tests: [not_null]



  - name: fact_match_player_minute
    description: One row per (match, player, minute) - the player's progression through the match. Gold/XP/last_hits/denies are cumulative values at that minute from the raw per-minute arrays; level is derived from cumulative xp via the xp_level constant.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: player_slot
        tests: [not_null]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: minute
        tests: [not_null]
      - name: gold
        tests: [not_null]
      - name: xp
        tests: [not_null]
      - name: level
        tests: [not_null]
      - name: last_hits
        tests: [not_null]
      - name: denies
        tests: [not_null]

  - name: fact_match_player_skills
    description: 'One row per (match, player, ability upgrade) - the hero''s skill progression. ability_upgrades_arr is a flat ordered array of ability ids; ids are decoded to display names via constants. minute is an approximation: the first minute the player''s derived level reached the skill point''s learn level.'
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: player_slot
        tests: [not_null]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: upgrade_index
        tests: [not_null]
      - name: ability_id
        tests: [not_null]
      - name: ability_name
        tests: [not_null]
      - name: is_talent
        description: True when the upgrade is a talent-tree pick (internal name starts with special_bonus or is the generic attribute bonus).
        tests:
          - not_null
      - name: minute
        tests: [not_null]
      - name: learn_level
        tests: [not_null]


  - name: fact_match_player_item_purchases
    description: 'One row per (match, player, item purchase) - the hero''s itemization over time. Items decoded to display names via dim_item, pre-game purchases clamped to minute 0.'
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: player_slot
        tests: [not_null]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_player')
                field: account_id
      - name: hero_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: purchase_index
        tests: [not_null]
      - name: item_internal_name
        tests: [not_null]
      - name: time_sec
        tests: [not_null]
      - name: minute
        tests: [not_null]
      - name: item_name
        tests: [not_null]

  - name: dim_rune
    description: Rune decode lookup - OpenDota rune type id (0-9) to display name.
    columns:
      - name: rune_key
        tests: [not_null, unique]


  - name: fact_match_player_runes
    description: One row per (match, player, rune type) - rune counts decoded via dim_rune.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: rune_key
        tests: [not_null]
      - name: rune_count
        tests: [not_null]

  - name: fact_match_player_damage
    description: One row per (match, player, target) - total damage dealt to each target, categorized as Hero/Building/Creep/Neutral/Ward/Other.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: target_key
        tests: [not_null]
      - name: target_category
      - name: damage_amount
        tests: [not_null]

  - name: fact_match_player_damage_taken
    description: One row per (match, player, source) - raw damage received from each source, categorized as Hero/Building/Creep/Neutral/Ward/Other.
    columns:
      - name: match_id
        tests: [not_null]
      - name: player_slot
        tests: [not_null]
      - name: source_key
        tests: [not_null]
      - name: source_category
      - name: damage_amount
        tests: [not_null]


  - name: fact_match_team_minute
    description: One row per (match, side, minute) - team-level per-minute gold (net worth proxy) and XP, summed from fact_match_player_minute.
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: minute
        tests: [not_null]
      - name: team_gold
        tests: [not_null]
      - name: team_xp
        tests: [not_null]

  - name: fact_hero_side
    description: One row per (hero, side) - picks, wins and win rate per side, precomputed for DirectQuery.
    columns:
      - name: hero_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hero')
                field: hero_id
      - name: side
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Radiant', 'Dire']
      - name: hero_side_picks
        tests: [not_null]
      - name: hero_side_wins
        tests: [not_null]
      - name: hero_side_win_rate
        tests: [not_null]

  - name: fact_hero_matchup_stats
    description: One row per matchup_label - games, radiant/dire wins and win rates, precomputed for DirectQuery.
    columns:
      - name: matchup_label
        tests: [not_null, unique]
      - name: matchup_games
        tests: [not_null]
      - name: radiant_wins
        tests: [not_null]
      - name: dire_wins
        tests: [not_null]
      - name: radiant_win_rate
        tests: [not_null]
      - name: dire_win_rate
        tests: [not_null]
