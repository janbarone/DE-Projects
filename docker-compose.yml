services:
  postgres:
    image: postgres:16
    container_name: dota_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs schema SQL on first container boot (empty volume)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dota}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - de_net

  # ==========================================================================
  # Dagster (opt-in):  docker compose --profile dagster up -d
  # Single container running `dagster dev` (webserver + daemon + scheduler).
  # ==========================================================================
  dagster:
    image: dagster/dagster:1.9.4
    profiles: ["dagster"]
    container_name: dota_dagster
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dota}
      POSTGRES_HOST: postgres
      DOTA_DATA_DIR: /opt/dota/sample_data
      DOTA_PYTHON: python
    volumes:
      - .:/opt/dota
      - dagster_home:/opt/dagster/dagster_home
    working_dir: /opt/dota/orchestration/dagster
    command: dagster dev -m definitions -h 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    networks:
      - de_net

  # ==========================================================================
  # Airflow (opt-in):  docker compose --profile airflow up -d
  # Scheduler + webserver + metadata Postgres. Run one orchestrator at a time.
  # ==========================================================================
  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    container_name: airflow_meta_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - de_net

  airflow-init:
    image: apache/airflow:2.10.4
    profiles: ["airflow"]
    container_name: airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: >
      /bin/bash -c "airflow db migrate &&
      airflow users create -u admin -p admin -f Admin -l User -r Admin -e admin@example.com"
    networks:
      - de_net

  airflow-webserver:
    image: apache/airflow:2.10.4
    profiles: ["airflow"]
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Pipeline deps (dbt, psycopg, etc.) are installed into the image at boot.
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core~=1.12.0 dbt-postgres~=1.11.0 psycopg[binary]>=3.2 python-dotenv requests"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dota}
      POSTGRES_HOST: postgres
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags
      - .:/opt/dota
    command: webserver
    ports:
      - "8080:8080"
    networks:
      - de_net

  airflow-scheduler:
    image: apache/airflow:2.10.4
    profiles: ["airflow"]
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core~=1.12.0 dbt-postgres~=1.11.0 psycopg[binary]>=3.2 python-dotenv requests"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dota}
      POSTGRES_HOST: postgres
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags
      - .:/opt/dota
    command: scheduler
    networks:
      - de_net

networks:
  de_net:
    driver: bridge

volumes:
  pgdata:
  dagster_home:
