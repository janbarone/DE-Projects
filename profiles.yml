# dbt connection profile. Committed to the repo so the project is reproducible.
# Defaults match docker-compose.yml; override with environment variables.
# Invoke dbt with:  dbt <cmd> --profiles-dir . --project-dir transform
transform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dota') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'silver') }}"
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
